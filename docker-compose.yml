services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: digischools
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: digischools
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digischools']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: change-me-minio
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  miniodata:
